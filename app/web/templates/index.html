<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>qB 达量限速管理</title>
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/shell.css">
<link rel="stylesheet" href="/static/css/cards.css">
<link rel="stylesheet" href="/static/css/panels.css">
<link rel="stylesheet" href="/static/css/sheet.css">
<link rel="stylesheet" href="/static/css/dialogs.css">
<link rel="stylesheet" href="/static/css/mobile.css">
<link rel="stylesheet" href="/static/css/extra.css">
</head>
<body data-platform="qb" data-page="devices" data-theme="qb">

<div class="shell">
    <aside class="sidebar" aria-label="侧边栏">
        <div class="brand">
            <div class="brand-logo">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3v10M8.5 6.5 12 3l3.5 3.5M5 14h14M7 17h10M9 20h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div>
                <div class="brand-title">qB 达量限速管理</div>
                <div class="brand-sub">流量监控 · 自动限速 <span class="ver" id="ver">v1.80</span></div>
            </div>
        </div>

        <div class="seg" data-seg>
            <span class="seg-ind"></span>
            <button type="button" data-p="qb"><svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M10 3v9M7 6l3-3 3 3M4 14h12M6 17h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>qB</button>
            <button type="button" data-p="emby"><svg width="15" height="15" viewBox="0 0 20 20" fill="none"><rect x="3" y="4.5" width="14" height="9.5" rx="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M8.5 8.2v3.6l3.8-1.8-3.8-1.8z" fill="currentColor"/></svg>Emby</button>
            <button type="button" data-p="merge"><svg width="15" height="15" viewBox="0 0 20 20" fill="none"><rect x="2.5" y="4" width="6.5" height="12" rx="1.2" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="4" width="6.5" height="12" rx="1.2" stroke="currentColor" stroke-width="1.5"/></svg>合并</button>
        </div>

        <button type="button" class="add-btn" data-open="add">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span id="addLabel">添加 qB 设备</span>
        </button>

        <div class="nav-label">功能</div>
        <nav class="nav">
            <button type="button" class="nav-item" data-page="devices">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><rect x="2.5" y="3" width="15" height="11" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M7 17h6M10 14v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                <span class="grow">设备管理</span>
                <span class="nav-badge" id="navDevCount">2</span>
            </button>
            <button type="button" class="nav-item" data-page="stats" data-follow>
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 16V10M7.5 16V5M12 16V8.5M16.5 16V3.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
                <span class="grow">流量图表</span>
                <span class="nav-tag">qB</span>
            </button>
            <button type="button" class="nav-item" data-page="events" data-follow>
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M10 6.5V10l2.5 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span class="grow">事件记录</span>
                <span class="nav-tag">qB</span>
                <span class="nav-badge alert" id="navEvCount">3</span>
            </button>
        </nav>

        <div class="spacer"></div>

        <div class="nav-label">系统</div>
        <nav class="nav">
            <button type="button" class="nav-item" data-page="syslogs">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><rect x="4" y="3" width="12" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M7 7.5h6M7 10.5h6M7 13.5h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                <span class="grow">系统日志</span>
            </button>
            <button type="button" class="nav-item" data-open="settings">
                <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="2.4" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.8v2.2M10 15v2.2M2.8 10h2.2M15 10h2.2M4.9 4.9l1.6 1.6M13.5 13.5l1.6 1.6M4.9 15.1l1.6-1.6M13.5 6.5l1.6-1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                <span class="grow">全局设置</span>
            </button>
        </nav>

        <div class="status">
            <div class="ring">
                <svg viewBox="0 0 36 36"><circle class="track" cx="18" cy="18" r="15.5" fill="none" stroke-width="3"/><circle class="bar" id="ringBar" cx="18" cy="18" r="15.5" fill="none" stroke-width="3" stroke-dasharray="97.4" stroke-dashoffset="0"/></svg>
                <span id="ringSec">5</span>
            </div>
            <div class="status-meta">
                <b><i></i>自动刷新</b>
                <small class="num" id="clock">--</small>
            </div>
            <button type="button" class="logout" title="退出登录" aria-label="退出登录">
                <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M8 4H5.5A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8M12.5 6.5 16 10l-3.5 3.5M16 10H8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
        <header class="mobile-top">
            <button type="button" class="icon-btn" id="menuBtn" aria-label="打开菜单">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
            <span class="mobile-title" id="mobileTitle">设备管理</span>
            <div class="seg" data-seg>
                <span class="seg-ind"></span>
                <button type="button" data-p="qb">qB</button>
                <button type="button" data-p="emby">Emby</button>
                <button type="button" data-p="merge">合并</button>
            </div>
        </header>

        <div class="page">
            <div class="head">
                <div class="head-text">
                    <div class="crumb"><i></i><span id="crumb">qBittorrent</span></div>
                    <h1 class="title" id="title">设备管理</h1>
                </div>
                <div class="pills" id="pills"></div>
            </div>
            <div id="content"></div>
        </div>
    </div>
</div>

<nav class="bottom-bar">
    <button type="button" data-page="devices"><svg width="21" height="21" viewBox="0 0 20 20" fill="none"><rect x="2.5" y="3" width="15" height="11" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M7 17h6M10 14v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>设备</button>
    <button type="button" data-page="stats"><svg width="21" height="21" viewBox="0 0 20 20" fill="none"><path d="M3 16V10M7.5 16V5M12 16V8.5M16.5 16V3.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>图表</button>
    <button type="button" data-page="events"><svg width="21" height="21" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M10 6.5V10l2.5 1.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>事件</button>
    <button type="button" data-page="syslogs"><svg width="21" height="21" viewBox="0 0 20 20" fill="none"><rect x="4" y="3" width="12" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><path d="M7 7.5h6M7 10.5h6M7 13.5h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>日志</button>
</nav>

<div class="modal-mask" id="modal"><div class="modal" id="modalBox"></div></div>
<div class="sheet-mask" id="sheetMask"></div>
<aside class="sheet" id="sheet" aria-label="设置面板"></aside>
<div class="toasts" id="toasts"></div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
