<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<script>
try { if (localStorage.getItem('qb-scheme') === 'dark') document.documentElement.dataset.scheme = 'dark'; } catch (e) {}
</script>
<title>修改密码 · qB 达量限速管理</title>
<link rel="icon" href="/favicon.ico" sizes="64x64">
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/shell.css">
<link rel="stylesheet" href="/static/css/panels.css">
<link rel="stylesheet" href="/static/css/sheet.css">
<link rel="stylesheet" href="/static/css/extra.css">
<link rel="stylesheet" href="/static/css/scheme.css">
</head>
<body data-theme="qb" class="login-page">
<main class="login-card">
    <div class="login-brand">
        <img class="brand-logo" src="/static/img/favicon.svg" alt="" width="40" height="40">
        <div>
            <h1>修改密码</h1>
            <p>设置新的登录密码</p>
        </div>
    </div>
    <form class="login-form" id="pwForm" autocomplete="on">
        <div>
            <div class="fl">原密码</div>
            <div class="inp"><input id="old" name="old_password" type="password" autocomplete="current-password" required autofocus></div>
        </div>
        <div>
            <div class="fl">新密码</div>
            <div class="inp"><input id="new" name="new_password" type="password" autocomplete="new-password" minlength="6" required></div>
        </div>
        <div>
            <div class="fl">确认新密码</div>
            <div class="inp"><input id="confirm" name="confirm_password" type="password" autocomplete="new-password" minlength="6" required></div>
        </div>
        <p class="login-error" id="err" hidden></p>
        <button class="btn primary" id="go" type="submit">保存</button>
        <button class="btn" id="logout" type="button">退出登录</button>
    </form>
    <p class="login-version" id="ver"></p>
</main>
<script type="module">
import { APP_VERSION } from '/static/js/version.js';
const $ = id => document.getElementById(id);
$('ver').textContent = APP_VERSION;
function showError(text) {
    $('err').textContent = text || '修改失败';
    $('err').hidden = false;
}
$('pwForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('go');
    btn.disabled = true;
    $('err').hidden = true;
    try {
        const r = await fetch('/api/auth/change-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                old_password: $('old').value,
                new_password: $('new').value,
                confirm_password: $('confirm').value,
            }),
        });
        const d = await r.json().catch(() => ({}));
        if (r.status === 401 && d.auth_required) {
            window.location.replace('/login');
            return;
        }
        if (r.ok && d.success) {
            window.location.replace('/');
            return;
        }
        showError(d.error || '修改失败');
    } catch (err) {
        showError('无法连接服务');
    }
    btn.disabled = false;
});
$('logout').addEventListener('click', async () => {
    try {
        await fetch('/api/auth/logout', { method: 'POST' });
    } catch (err) {}
    window.location.replace('/login');
});
</script>
</body>
</html>
