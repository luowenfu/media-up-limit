<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>登录 · qB 达量限速管理</title>
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/shell.css">
<link rel="stylesheet" href="/static/css/panels.css">
<link rel="stylesheet" href="/static/css/sheet.css">
<link rel="stylesheet" href="/static/css/extra.css">
</head>
<body data-theme="qb" class="login-page">
<main class="login-card">
    <div class="login-brand">
        <div class="brand-logo">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3v10M8.5 6.5 12 3l3.5 3.5M5 14h14M7 17h10M9 20h6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div>
            <h1>qB 达量限速管理</h1>
            <p>登录后继续</p>
        </div>
    </div>
    <form class="login-form" id="loginForm" autocomplete="on">
        <div>
            <div class="fl">账号</div>
            <div class="inp"><input id="user" name="username" value="admin" autocomplete="username" autofocus></div>
        </div>
        <div>
            <div class="fl">密码</div>
            <div class="inp"><input id="pass" name="password" type="password" autocomplete="current-password"></div>
        </div>
        <label class="login-remember"><input type="checkbox" id="remember" checked>保持登录</label>
        <p class="login-error" id="err" hidden></p>
        <button class="btn primary" id="go" type="submit">登录</button>
    </form>
    <p class="login-version" id="ver"></p>
</main>
<script type="module">
import { APP_VERSION } from '/static/js/version.js';
const $ = id => document.getElementById(id);
$('ver').textContent = APP_VERSION;
$('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('go');
    btn.disabled = true;
    $('err').hidden = true;
    try {
        const r = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: $('user').value.trim(), password: $('pass').value, remember: $('remember').checked }),
        });
        const d = await r.json().catch(() => ({}));
        if (r.ok && d.success) { window.location.replace('/'); return; }
        $('err').textContent = d.error || '登录失败';
    } catch (err) {
        $('err').textContent = '无法连接服务';
    }
    $('err').hidden = false;
    btn.disabled = false;
});
</script>
</body>
</html>
