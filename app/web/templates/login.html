<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<script>
try { if (localStorage.getItem('qb-scheme') === 'dark') document.documentElement.dataset.scheme = 'dark'; } catch (e) {}
</script>
<title>登录 · qB 达量限速管理</title>
<link rel="icon" href="/favicon.ico" sizes="64x64">
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/shell.css">
<link rel="stylesheet" href="/static/css/panels.css">
<link rel="stylesheet" href="/static/css/sheet.css">
<link rel="stylesheet" href="/static/css/extra.css">
<link rel="stylesheet" href="/static/css/scheme.css">
</head>
<body data-theme="qb" class="login-page">
<main class="login-card">
    <div class="login-brand">
        <img class="brand-logo" src="/static/img/favicon.svg" alt="" width="40" height="40">
        <div>
            <h1>qB 达量限速管理</h1>
            <p>登录后继续</p>
        </div>
    </div>
    <form class="login-form" id="loginForm" autocomplete="on">
        <div>
            <div class="fl">账号</div>
            <div class="inp"><input id="user" name="username" autocomplete="username" required autofocus></div>
        </div>
        <div>
            <div class="fl">密码</div>
            <div class="inp"><input id="pass" name="password" type="password" autocomplete="current-password"></div>
        </div>
        <label class="login-remember"><input type="checkbox" id="remember" checked>保持登录</label>
        <p class="login-error" id="err" hidden></p>
        <button class="btn primary" id="go" type="submit">登录</button>
    </form>
    <p class="login-version" id="ver"></p>
</main>
<script type="module">
import { APP_VERSION } from '/static/js/version.js';
const $ = id => document.getElementById(id);
$('ver').textContent = APP_VERSION;
let waitTimer = 0;
function showError(text) {
    $('err').textContent = text || '登录失败';
    $('err').hidden = false;
}
function startCountdown(seconds) {
    window.clearInterval(waitTimer);
    let left = Math.max(1, Number(seconds) || 1);
    const btn = $('go');
    const tick = () => {
        if (left <= 0) {
            window.clearInterval(waitTimer);
            btn.disabled = false;
            $('err').hidden = true;
            return;
        }
        showError(`请 ${left} 秒后再试`);
        btn.disabled = true;
        left -= 1;
    };
    tick();
    waitTimer = window.setInterval(tick, 1000);
}
$('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('go');
    if (btn.disabled) return;
    btn.disabled = true;
    $('err').hidden = true;
    try {
        const r = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: $('user').value.trim(), password: $('pass').value, remember: $('remember').checked }),
        });
        const d = await r.json().catch(() => ({}));
        if (d.setup_required) {
            window.location.replace('/setup');
            return;
        }
        if (r.ok && d.success) {
            window.location.replace('/');
            return;
        }
        if (r.status === 429 && d.retry_after) {
            startCountdown(d.retry_after);
            return;
        }
        showError(d.error || '登录失败');
    } catch (err) {
        showError('无法连接服务');
    }
    btn.disabled = false;
});
</script>
</body>
</html>
