<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<script>
try { if (localStorage.getItem('qb-scheme') === 'dark') document.documentElement.dataset.scheme = 'dark'; } catch (e) {}
</script>
<title>初次设置 · 媒体达量管理</title>
<link rel="icon" href="/favicon.ico" sizes="64x64">
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/shell.css">
<link rel="stylesheet" href="/static/css/panels.css">
<link rel="stylesheet" href="/static/css/sheet.css">
<link rel="stylesheet" href="/static/css/extra.css">
<link rel="stylesheet" href="/static/css/scheme.css">
</head>
<body data-theme="qb" class="login-page">
<main class="login-card">
    <div class="login-brand">
        <img class="brand-logo" src="/static/img/favicon.svg" alt="" width="40" height="40">
        <div>
            <h1>初次设置</h1>
            <p>请设置账号和密码</p>
        </div>
    </div>
    <form class="login-form" id="setupForm" autocomplete="on">
        <div>
            <div class="fl">账号</div>
            <div class="inp"><input id="user" name="username" value="{{ username }}" autocomplete="username" required autofocus></div>
        </div>
        <div>
            <div class="fl">密码</div>
            <div class="inp"><input id="pass" name="password" type="password" autocomplete="new-password" minlength="6" required></div>
        </div>
        <div>
            <div class="fl">确认密码</div>
            <div class="inp"><input id="confirm" name="confirm_password" type="password" autocomplete="new-password" minlength="6" required></div>
        </div>
        <label class="login-remember"><input type="checkbox" id="remember" checked>保持登录（30 天）</label>
        <p class="login-error" id="err" hidden></p>
        <button class="btn primary" id="go" type="submit">完成设置</button>
    </form>
    <p class="login-version" id="ver"></p>
</main>
<script type="module">
import { APP_VERSION } from '/static/js/version.js';
const $ = id => document.getElementById(id);
$('ver').textContent = APP_VERSION;
if (!$('user').value) $('user').focus();
else $('pass').focus();
$('setupForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('go');
    btn.disabled = true;
    $('err').hidden = true;
    try {
        const r = await fetch('/api/auth/setup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: $('user').value.trim(),
                password: $('pass').value,
                confirm_password: $('confirm').value,
                remember: $('remember').checked,
            }),
        });
        const d = await r.json().catch(() => ({}));
        if (r.ok && d.success) {
            window.location.replace('/');
            return;
        }
        if (r.status === 403 && !d.setup_required) {
            window.location.replace('/login');
            return;
        }
        $('err').textContent = d.error || '设置失败';
    } catch (err) {
        $('err').textContent = '无法连接服务';
    }
    $('err').hidden = false;
    btn.disabled = false;
});
</script>
</body>
</html>
